# Manda subito il riepilogo del mattino: utile per provare il bot senza aspettare le 7.
# Si lancia a mano: Actions → "Prova riepilogo" → Run workflow.
name: Prova riepilogo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  riepilogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Invia il riepilogo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AZDORA_NOME: ${{ vars.AZDORA_NOME }}
        run: python -m azdora.lavori mattino
