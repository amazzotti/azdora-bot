# Collega il bot al webhook su Vercel e aggiorna il menu dei comandi.
# Si lancia a mano: Actions → "Configura bot" → Run workflow.
# Con "Solo controllo" mostra lo stato del webhook e l'ultimo errore senza cambiare nulla.
name: Configura bot

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Indirizzo del progetto Vercel (es. https://azdora-bot.vercel.app)"
        required: true
        default: "https://azdora-bot.vercel.app"
      solo_controllo:
        description: "Solo controllo: mostra lo stato e l'ultimo errore, senza cambiare nulla"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  configura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Imposta webhook e comandi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          # Gli input passano da variabili d'ambiente, non dentro lo script: evita injection.
          URL_VERCEL: ${{ inputs.url }}
          SOLO_CONTROLLO: ${{ inputs.solo_controllo }}
        run: |
          if [ "$SOLO_CONTROLLO" = "true" ]; then
            python -m azdora.configura --solo-info
          else
            python -m azdora.configura --url "$URL_VERCEL"
          fi
